name: Build APK

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # empty on forks and before the secrets are added, the release steps skip then
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate the gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # debug keeps full class names, it is the build to read a crash from
      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-memos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore the signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # shrunk by r8 and signed with the stable key, the build meant to be installed
      - name: Assemble the release APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload the release APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: voice-memos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # F-Droid only publishes this build if it carries the key listed in AllowedAPKSigningKeys,
      # apksigner prints the certificate digest in exactly that form, lowercase hex without colons
      - name: Print the signing certificate fingerprint
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          SHA256="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "Signing certificate SHA-256: $SHA256"
          {
            echo "### Release signing certificate"
            echo ""
            echo "AllowedAPKSigningKeys: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
            app/build/outputs/mapping/
          retention-days: 7
