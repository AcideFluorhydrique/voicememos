syntax = "proto3";

option java_package = "com.eva.feature_widget.proto";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;

import "google/protobuf/duration.proto";

message RecorderWidgetDataProto{
  RecordingModeProto mode = 1;
  google.protobuf.Duration duration = 2;
  // whether the microphone permission is held. The widget checks the permission itself
  // when it draws, this copy exists so that a change of it changes the state, which is
  // the only thing that makes the widget draw again
  bool can_record = 3;
}

enum RecordingModeProto{
  IDLE_OR_COMPLETED = 0;
  RECORDING = 1;
  PAUSED = 2;
}